{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm-proxy.fullname" . }}-postgres
  labels:
    {{- include "litellm-proxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "litellm-proxy.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
