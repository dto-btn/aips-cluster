apiVersion: v2
name: cert-manager-config
description: cert-manager ClusterIssuer(s) for the AIPS cluster. The cert-manager
  controller itself and its Azure workload identity (federated credential + DNS
  Zone Contributor role) are provisioned by Terraform (SSC-CIOAssistant-iac,
  modules/L2_blueprint_aks) since they depend on Azure resources this chart has
  no way to create. This chart only manages the Kubernetes-native ClusterIssuer
  object(s) that reference that identity.
type: application
version: 1.0.0
