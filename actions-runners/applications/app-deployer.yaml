# Note, this app is manually deployed, initially.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name:  app-deployer
  namespace: &project actions-runners
  annotations:
    kubernetes.io/descripton: Deploys all of the applications that are part of the actions-runners cluster to keep it aligned with what is in source.
spec:
  destination:
    namespace: *project
    name: in-cluster
  info:
    - name: about
      value: Deploys all of the applications that are part of the canchat-platform environment to keep it aligned with what is in source.
    - name: source
      value: https://github.com/dto-btn/aips-cluster/tree/main/actions-runners/applications/app-deployer.yaml
  project: *project
  sources:
  # Helm Value Precedence: https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-value-precedence
  # Multiple Sources: https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/
  - repoURL: &iacRepo 'https://github.com/dto-btn/aips-cluster'
    targetRevision: &iacTargetRevision main
    path: actions-runners/applications
  syncPolicy:
    automated:
      selfHeal: true
