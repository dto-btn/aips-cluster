apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name:  &name arc-runner-dto-btn
  namespace: &project actions-runners
  annotations:
    kubernetes.io/descripton: A runner set used for the dto-btn GitHub org.
spec:
  destination:
    name: actions-runners-cluster
    namespace: *name
  info:
    - name: about
      value: A private runner configuration for the dto-btn org.
    - name: source
      value: https://github.com/dto-btn/aips-cluster/tree/main/actions-runners/applications/arc-runner-dto-btn.yaml
  project: *project
  sources:
  # Helm Value Precedence: https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-value-precedence
  # Multiple Sources: https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/
  - helm:
      releaseName: *name
      valueFiles:
      - $values/actions-runners/arc-runner-dto-btn/values.yaml
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    targetRevision: 0.14.2
    path: .
  - repoURL: &iacRepo 'https://github.com/dto-btn/aips-cluster'
    targetRevision: &iacTargetRevision main
    ref: values
  - repoURL: *iacRepo
    targetRevision: *iacTargetRevision
    path: actions-runners/arc-runner-dto-btn/manifests
    directory:
      recurse: false
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
