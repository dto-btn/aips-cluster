apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name:  actions-runner-controller
  namespace: &project actions-runners
  annotations:
    kubernetes.io/descripton: Controller for managing private Github Actions runners.
spec:
  destination:
    namespace: arc-system
    name: actions-runners-cluster
  info:
    - name: about
      value: Deploys the controller which manages the CRDs for private Github Action runners.
  project: *project
  sources:
  # Helm Value Precedence: https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-value-precedence
  # Multiple Sources: https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/
  - helm:
      releaseName: arc
      valuesObject:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    targetRevision: 0.14.2
    path: .
  - repoURL: &iacRepo 'https://github.com/dto-btn/aips-cluster'
    targetRevision: &iacTargetRevision main
    path: actions-runners/actions-runner-controller/manifests
    directory:
      recurse: false
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
