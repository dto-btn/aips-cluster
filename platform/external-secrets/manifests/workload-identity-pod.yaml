apiVersion: v1
kind: Pod
metadata:
  name: quick-start
  namespace: aips-platform
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: workload-identity-sa
  containers:
    - image: ghcr.io/azure/azure-workload-identity/msal-go
      name: oidc
      env:
      - name: KEYVAULT_URL
        value: "https://eso-argocd-4519-kv.vault.azure.net/"
      # - name: SECRET_NAME
      #   value: ${KEYVAULT_SECRET_NAME}
  nodeSelector:
    kubernetes.io/os: linux