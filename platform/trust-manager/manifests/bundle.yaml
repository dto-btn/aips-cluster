# Distributes the AIPS internal root CA (see
# platform/cert-manager/manifests/root-ca-certificate.yaml) to every
# namespace as a ConfigMap, so any pod can mount it to validate certs issued
# by "aips-internal-ca-issuer" without needing per-namespace copies of the CA.
#
# useDefaultCAs also folds in the public Mozilla/Debian CA bundle so a single
# ConfigMap can be used as the one-stop trust store for both internal and
# public TLS endpoints.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: aips-trust-bundle
spec:
  sources:
    - secret:
        name: aips-root-ca-secret
        key: tls.crt
    - configMap:
        name: corporate-proxy-ca
        key: ca.crt
    - useDefaultCAs: true
  target:
    configMap:
      key: ca-bundle.crt
    namespaceSelector: {} # empty selector == sync to all namespaces
