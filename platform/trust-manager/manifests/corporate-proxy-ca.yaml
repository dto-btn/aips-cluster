# Public CA certificates for the corporate TLS-inspection proxy (Cloud-Nuage
# SSL Proxy). No private key material here -- these are public certs, safe to
# commit -- so a ConfigMap is used instead of a Secret.
#
# Consumed as a source by platform/trust-manager/manifests/bundle.yaml,
# which distributes it cluster-wide, replacing the old approach of hardcoding
# short-lived per-host leaf certs in platform/argo-cd/values.yaml
# (configs.tls.certificates). Trusting the CA directly means ANY hostname
# re-signed by this proxy validates, not just the couple of hosts that used
# to be hardcoded there.
#
# TODO: "Cloud-Nuage SSL Proxy" is issued by "GOC-GDC-ISSUING-A1A", which is
# NOT included below. Until that issuing/root CA cert is added here too, the
# chain is incomplete for clients that enforce strict chain building (most
# don't, since "Cloud-Nuage SSL Proxy" itself is a trusted CA:TRUE cert, but
# add the missing link when available for full correctness).
apiVersion: v1
kind: ConfigMap
metadata:
  name: corporate-proxy-ca
  namespace: cert-manager
data:
