# Real, cluster-wide issuer for internally-facing certificates (in-cluster
# mTLS, internal ingress/services, etc.), backed by the root CA minted in
# root-ca-certificate.yaml. Any workload can request certs from this issuer
# by pointing a Certificate/ingress annotation at "aips-internal-ca-issuer".
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aips-internal-ca-issuer
spec:
  ca:
    secretName: aips-root-ca-secret
