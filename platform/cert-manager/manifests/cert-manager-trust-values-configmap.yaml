apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-trust-values
  namespace: cert-manager
data:
  values.yaml: |
    extraEnv:
      - name: SSL_CERT_FILE
        value: /etc/ssl/certs/ca-bundle.crt

    volumes:
      - name: ca-bundle
        configMap:
          name: aips-trust-bundle
          defaultMode: 0644

    volumeMounts:
      - name: ca-bundle
        mountPath: /etc/ssl/certs/ca-bundle.crt
        subPath: ca-bundle.crt
        readOnly: true
