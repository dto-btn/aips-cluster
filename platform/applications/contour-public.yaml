apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &name contour-public
  namespace: &env aips-platform
spec:
  destination:
    namespace: *name
    server: https://kubernetes.default.svc
  project: *env
  sources:
  # Helm Value Precedence: https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-value-precedence
  # Multiple Sources: https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/
  - helm:
      releaseName: *name
      valuesObject:
        contour:
          ingressClass:
            name: *name
            create: true
            default: false
      valueFiles:
      - $values/platform/contour-public/values.yaml
    repoURL: https://projectcontour.github.io/helm-charts/
    chart: contour
    targetRevision: 0.1.0
    path: '.'
  - repoURL: &iacRepo 'https://github.com/dto-btn/aips-cluster'
    targetRevision: &iacTargetRevision main
    ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
