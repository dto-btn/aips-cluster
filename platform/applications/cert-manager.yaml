apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &name cert-manager
  namespace: &env aips-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  destination:
    namespace: *name
    server: https://kubernetes.default.svc
  
  # https://github.com/Azure/AKS/issues/4002 See this issue for why this is added
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: cert-manager-webhook
    jqPathExpressions:
    - '.webhooks[] | select(.name == "webhook.cert-manager.io") | .namespaceSelector'
  project: *env
  sources:
  - helm:
      releaseName: *name
      valueFiles:
      - $values/platform/cert-manager/values.yaml
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    chart: cert-manager
    targetRevision: v1.21.1
    path: '.'
  - repoURL: &iacRepo 'https://github.com/dto-btn/aips-cluster'
    targetRevision: &iacTargetRevision main
    ref: values
  - repoURL: *iacRepo
    targetRevision: *iacTargetRevision
    path: platform/cert-manager/manifests
    directory:
      recurse: false
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
