apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: &name external-secrets
  namespace: &env aips-platform
spec:
  destination:
    namespace: *name
    server: https://kubernetes.default.svc
  project: *env
  sources:
  # Helm Value Precedence: https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-value-precedence
  # Multiple Sources: https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/
  - helm:
      releaseName: *name
      valueFiles:
      - $values/platform/external-secrets/values.yaml
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
  - repoURL: &iacRepo 'https://github.com/dto-btn/aips-cluster'
    targetRevision: &iacTargetRevision main
    ref: values
  - repoURL: *iacRepo
    targetRevision: *iacTargetRevision
    path: platform/external-secrets/manifests
    directory:
      recurse: false
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
